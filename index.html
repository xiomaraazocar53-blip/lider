<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>YouTube</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-top:58px;
  padding-bottom:76px;
}

/* BARRA SUPERIOR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;
  background:#0f0f0f;
  display:flex;
  align-items:center;
  padding:0 14px;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:transform .25s ease;
}

.youtube-logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:600;
  white-space:nowrap;
}

.youtube-symbol{
  width:29px;
  height:20px;
  background:#ff0000;
  border-radius:6px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.youtube-symbol:after{
  content:"";
  width:0;
  height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:8px solid white;
  margin-left:2px;
}

.top-search{
  margin-left:auto;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  color:#aaa;
}

.top-search svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:#aaa;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* CATEGORÍAS */
.categories{
  position:fixed;
  top:58px;
  left:0;
  right:0;
  height:47px;
  background:#0f0f0f;
  z-index:999;
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 10px;
  overflow-x:auto;
  scrollbar-width:none;
  transition:transform .25s ease;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories.hidden{
  transform:translateY(-105px);
}

.category{
  flex:none;
  border:1px solid rgba(150,150,150,.18);
  background:#1c1c1c;
  color:#ddd;
  border-radius:18px;
  padding:7px 14px;
  font-size:13px;
  white-space:nowrap;
  text-decoration:none;
}

/* CASCADA */
#feed{
  width:100%;
  max-width:650px;
  margin:0 auto;
}

.video-card{
  width:100%;
  padding:10px 10px 15px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#181818;
  border-radius:8px;
}

.video-info{
  display:flex;
  align-items:center;
  gap:9px;
  padding-top:9px;
}

.video-youtube-symbol{
  width:26px;
  height:18px;
  background:#ff0000;
  border-radius:5px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.video-youtube-symbol:after{
  content:"";
  width:0;
  height:0;
  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  border-left:7px solid white;
  margin-left:1px;
}

.video-label{
  font-size:14px;
  color:#aaa;
}

/* NAVEGACIÓN INFERIOR */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(15,15,15,.97);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:3000;
  padding-bottom:2px;
}

.nav-item{
  width:20%;
  height:68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#aaa;
  font-size:10px;
  gap:4px;
  background:transparent;
  border:0;
}

.nav-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(130,130,130,.10);
  border:1px solid rgba(150,150,150,.16);
  border-radius:10px;
}

.nav-icon svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:#aaa;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-plus{
  font-size:24px;
  line-height:1;
  color:#aaa;
  font-weight:300;
}

/* PANTALLA DE BÚSQUEDA */
.search-screen{
  position:fixed;
  inset:0;
  background:#0f0f0f;
  z-index:2500;
  display:none;
  overflow-y:auto;
  padding:12px 14px 90px;
}

.search-screen.active{
  display:block;
}

.search-header{
  display:flex;
  align-items:center;
  gap:9px;
  height:48px;
}

.back-button{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#aaa;
}

.back-button svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:#aaa;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.search-box{
  flex:1;
  height:40px;
  border:1px solid rgba(150,150,150,.22);
  background:#1a1a1a;
  border-radius:21px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.search-input{
  flex:1;
  min-width:0;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  padding:0 12px;
  font-size:15px;
}

.search-input::placeholder{
  color:#777;
}

.clear-button{
  width:36px;
  height:36px;
  flex:none;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:21px;
  display:none;
  align-items:center;
  justify-content:center;
}

.search-submit{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#aaa;
}

.search-submit svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:#aaa;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* HISTORIAL */
.history{
  padding-top:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.history-title{
  width:100%;
  text-align:center;
  color:#888;
  font-size:13px;
  margin-bottom:12px;
}

.history-item{
  width:100%;
  max-width:420px;
  min-height:44px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
}

.history-item-text{
  flex:1;
  text-align:center;
  padding-left:36px;
  color:#ccc;
  font-size:14px;
}

.history-delete{
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  color:#777;
  font-size:18px;
}

.clear-history{
  margin-top:20px;
  align-self:center;
  border:1px solid rgba(150,150,150,.18);
  background:#1b1b1b;
  color:#aaa;
  border-radius:18px;
  padding:8px 15px;
  font-size:12px;
}

/* RESULTADOS */
.search-results{
  padding-top:18px;
}

.result-item{
  padding:12px 4px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  gap:10px;
}

.result-text{
  flex:1;
  color:#ddd;
  font-size:14px;
  word-break:break-word;
}

.result-button{
  width:38px;
  height:38px;
  flex:none;
  border:0;
  background:transparent;
}

.result-button svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:#aaa;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* SIN RESALTADO */
button,
a,
input{
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

button:focus,
a:focus,
input:focus{
  outline:none;
}
</style>
</head>

/* =========================
   OBTENER ID DEL VIDEO
   ========================= */

function getVideoId(url){

  if(url.includes("/live/")){
    return url.split("/live/")[1].split("?")[0];
  }

  if(url.includes("youtu.be/")){
    return url.split("youtu.be/")[1].split("?")[0];
  }

  if(url.includes("watch?v=")){
    return url.split("watch?v=")[1].split("&")[0];
  }

  return "";
}


/* =========================
   CREAR CASCADA
   ========================= */

const feed = document.getElementById("feed");

videos.forEach(function(url){

  const id = getVideoId(url);

  if(!id) return;

  const card = document.createElement("div");
  card.className = "video-card";

  const img = document.createElement("img");

  img.className = "thumbnail";

  img.src =
    "https://img.youtube.com/vi/" +
    id +
    "/hqdefault.jpg";

  img.alt = "Video";

  img.loading = "lazy";

  img.addEventListener("click",function(){

    window.location.href = url;

  });


  const info = document.createElement("div");

  info.className = "video-info";


  const symbol =
    document.createElement("div");

  symbol.className =
    "video-youtube-symbol";


  const label =
    document.createElement("div");

  label.className =
    "video-label";

  label.textContent =
    "Video";


  info.appendChild(symbol);
  info.appendChild(label);

  card.appendChild(img);
  card.appendChild(info);

  feed.appendChild(card);

});


/* =========================
   BÚSQUEDA
   ========================= */

const openSearch =
  document.getElementById("openSearch");

const searchScreen =
  document.getElementById("searchScreen");

const backSearch =
  document.getElementById("backSearch");

const searchInput =
  document.getElementById("searchInput");

const clearSearch =
  document.getElementById("clearSearch");

const searchSubmit =
  document.getElementById("searchSubmit");

const historyBox =
  document.getElementById("history");

const searchResults =
  document.getElementById("searchResults");


const HISTORY_KEY =
  "youtube_history";

const MAX_HISTORY = 20;


/* OBTENER HISTORIAL */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );

  }catch(e){

    return [];

  }

}


/* GUARDAR HISTORIAL */

function saveHistory(text){

  text = text.trim();

  if(!text) return;

  let history = getHistory();

  history =
    history.filter(function(item){

      return item.toLowerCase()
        !== text.toLowerCase();

    });

  history.unshift(text);

  history =
    history.slice(0,MAX_HISTORY);

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  renderHistory();

}


/* MOSTRAR HISTORIAL */

function renderHistory(){

  historyBox.innerHTML = "";

  const history =
    getHistory();


  if(history.length === 0){

    historyBox.innerHTML =
      '<div class="history-title">Sin búsquedas recientes</div>';

    return;

  }


  const title =
    document.createElement("div");

  title.className =
    "history-title";

  title.textContent =
    "Historial";

  historyBox.appendChild(title);


  history.forEach(function(text){

    const row =
      document.createElement("div");

    row.className =
      "history-item";


    const textBox =
      document.createElement("div");

    textBox.className =
      "history-item-text";

    textBox.textContent =
      text;


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "history-delete";

    deleteButton.textContent =
      "×";


    deleteButton.onclick =
      function(e){

        e.stopPropagation();

        let h = getHistory();

        h =
          h.filter(function(item){

            return item !== text;

          });

        localStorage.setItem(
          HISTORY_KEY,
          JSON.stringify(h)
        );

        renderHistory();

      };


    row.appendChild(textBox);
    row.appendChild(deleteButton);


    row.onclick =
      function(){

        searchInput.value =
          text;

        updateClearButton();

        performSearch();

      };


    historyBox.appendChild(row);

  });


  const clearHistoryButton =
    document.createElement("button");

  clearHistoryButton.className =
    "clear-history";

  clearHistoryButton.textContent =
    "Borrar historial";


  clearHistoryButton.onclick =
    function(){

      localStorage.removeItem(
        HISTORY_KEY
      );

      renderHistory();

    };


  historyBox.appendChild(
    clearHistoryButton
  );

}


/* ABRIR BÚSQUEDA */

openSearch.onclick =
  function(){

    searchScreen.classList.add(
      "active"
    );

    renderHistory();

    setTimeout(function(){

      searchInput.focus();

    },100);

  };


/* VOLVER */

backSearch.onclick =
  function(){

    searchScreen.classList.remove(
      "active"
    );

    searchResults.innerHTML =
      "";

  };


/* MOSTRAR X */

function updateClearButton(){

  if(searchInput.value.trim()){

    clearSearch.style.display =
      "flex";

  }else{

    clearSearch.style.display =
      "none";

  }

}


searchInput.addEventListener(
  "input",
  function(){

    updateClearButton();

  }
);


/* BORRAR TEXTO */

clearSearch.onclick =
  function(){

    searchInput.value =
      "";

    searchResults.innerHTML =
      "";

    updateClearButton();

    searchInput.focus();

  };


/* REALIZAR BÚSQUEDA */

function performSearch(){

  const text =
    searchInput.value.trim();

  if(!text) return;

  saveHistory(text);

  window.location.href =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(text);

}


searchSubmit.onclick =
  function(){

    performSearch();

  };


searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      performSearch();

    }

  }
);


/* =========================
   OCULTAR / MOSTRAR
   ========================= */

let lastScroll = 0;

window.addEventListener(
  "scroll",
  function(){

    const current =
      window.scrollY;


    if(
      current > lastScroll &&
      current > 70
    ){

      document.getElementById(
        "topbar"
      ).style.transform =
        "translateY(-105px)";

      document.getElementById(
        "categories"
      ).classList.add(
        "hidden"
      );

    }else{

      document.getElementById(
        "topbar"
      ).style.transform =
        "translateY(0)";

      document.getElementById(
        "categories"
      ).classList.remove(
        "hidden"
      );

    }


    lastScroll =
      current;

  }
);


/* HISTORIAL INICIAL */

renderHistory();

</script>
